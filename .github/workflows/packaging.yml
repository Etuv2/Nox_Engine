name: Packaging checks

on:
  push:
    paths:
      - "tools/*.ps1"
      - "tools/benchmark_pack_compression.py"
      - "packaging/**"
      - "tests/PackagingTests.ps1"
      - "CMakeLists.txt"
      - ".github/workflows/packaging.yml"
  pull_request:
    paths:
      - "tools/*.ps1"
      - "tools/benchmark_pack_compression.py"
      - "packaging/**"
      - "tests/PackagingTests.ps1"
      - "CMakeLists.txt"
      - ".github/workflows/packaging.yml"

permissions:
  contents: read

jobs:
  packaging:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dependency packaging and cleanup
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/PackagingTests.ps1
      - name: Test archive benchmark calculations
        shell: powershell
        run: python tools/benchmark_pack_compression.py --self-test
