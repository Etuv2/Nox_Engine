name: Windows build

on:
  push:
    branches: ['claude/**', main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build (Release)
        run: cmake --build --preset vs2022-x64-release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Nox_Engine-win64-${{ github.sha }}
          path: build/vs2022-x64/Release/
          retention-days: 30
